# =============================================================================
# Docker Compose — Microservices Architecture
# =============================================================================
# Single env source: ../server/config/secrets.env
#
# Run from `docker/` with:
#   docker compose --env-file ../server/config/secrets.env up
#
# (In PyCharm/IntelliJ: Edit Run Configuration -> Environment variables /
#  Env file -> select `server/config/secrets.env` to run with one click.)
# =============================================================================

x-common-env-file: &common-env-file
    env_file:
        - path: ../server/config/secrets.env
          required: false

x-backend-common-env: &backend-common-env
    POSTGRES_HOST: postgres
    POSTGRES_PORT: 5432
    POSTGRES_DB: ${POSTGRES_DB:-demo}
    POSTGRES_USER: ${POSTGRES_USER:-demo}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-demo}
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-demo}:${POSTGRES_PASSWORD:-demo}@postgres:5432/${POSTGRES_DB:-demo}
    NEO4J_URL: bolt://neo4j:7687
    NEO4J_USERNAME: ${NEO4J_USERNAME:-demo}
    NEO4J_PASSWORD: ${NEO4J_PASSWORD:-demo}
    NEO4J_DATABASE: ${NEO4J_DATABASE:-demo}
    S3_URL: http://seaweedfs:8333
    S3_USERNAME: ${S3_USERNAME:-demo}
    S3_PASSWORD: ${S3_PASSWORD:-demo}
    STORAGE_PATH: /tmp/demo-document-staging/docs
    TMPDIR: /tmp/demo-document-staging
    REDIS_HOST: redis
    REDIS_PORT: 6379
    REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    JWT_SECRET: ${JWT_SECRET:-ask-local-demo-jwt-secret-change-before-deployment}
    SECRET: ${SECRET:-ask-local-demo-microservices-secret}
    OLLAMA_BASE_URL: ${DOCKER_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    OTEL_ENABLED: ${OTEL_ENABLED:-false}
    OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    TEMPORAL_ENABLED: ${TEMPORAL_ENABLED:-true}
    TEMPORAL_ADDRESS: temporal:7233
    TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
    TEMPORAL_MICROSERVICES_TASK_QUEUE: ${TEMPORAL_MICROSERVICES_TASK_QUEUE:-demo-microservices}

services:

    # =========================================================================
    # DATABASES & INFRASTRUCTURE
    # =========================================================================
    postgres:
        <<: *common-env-file
        image: postgres:17
        container_name: postgres
        environment:
            POSTGRES_DB: ${POSTGRES_DB:-demo}
            POSTGRES_USER: ${POSTGRES_USER:-demo}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-demo}
        ports:
            - "${POSTGRES_PORT:-5433}:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-demo} -d ${POSTGRES_DB:-demo}"]
            interval: 10s
            timeout: 5s
            retries: 5
        restart: unless-stopped

    neo4j:
        image: neo4j:5.26-community
        container_name: neo4j
        environment:
            NEO4J_AUTH: ${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:-demo}
        ports:
            - "${NEO4J_HTTP_PORT:-7474}:7474"
            - "${NEO4J_BOLT_PORT:-7687}:7687"
        volumes:
            - neo4jdata:/data
        healthcheck:
            test: [ "CMD-SHELL", "cypher-shell -u ${NEO4J_USERNAME:-neo4j} -p ${NEO4J_PASSWORD:-demo} 'RETURN 1' || exit 1" ]
            interval: 10s
            timeout: 10s
            retries: 20
        restart: unless-stopped

    seaweedfs:
        <<: *common-env-file
        image: chrislusf/seaweedfs:latest
        container_name: seaweedfs
        command: ["server", "-s3", "-dir=/data", "--ip.bind=0.0.0.0"]
        environment:
            AWS_ACCESS_KEY_ID: ${S3_USERNAME:-demo}
            AWS_SECRET_ACCESS_KEY: ${S3_PASSWORD:-demo}
        ports:
            - "${S3_PORT:-8333}:8333"
        volumes:
            - s3data:/data
        restart: unless-stopped

    redis:
        <<: *common-env-file
        image: redis:7-alpine
        container_name: redis
        environment:
            REDIS_PASSWORD: ${REDIS_PASSWORD:-}
        command: >
            sh -c '
            if [ -n "$$REDIS_PASSWORD" ]; then
                exec redis-server --requirepass "$$REDIS_PASSWORD";
            else
                exec redis-server;
            fi
            '
        ports:
            - "${REDIS_PORT:-6379}:6379"
        healthcheck:
            test: ["CMD-SHELL", "if [ -n \"$$REDIS_PASSWORD\" ]; then redis-cli -a \"$$REDIS_PASSWORD\" ping; else redis-cli ping; fi"]
            interval: 5s
            timeout: 5s
            retries: 20
        restart: unless-stopped
        volumes:
            - redisdata:/data

    temporal:
        image: temporalio/temporal:latest
        container_name: temporal
        user: root
        command: [ "server", "start-dev", "--ip", "0.0.0.0", "--ui-ip", "0.0.0.0", "--db-filename", "/var/lib/temporal/temporal.db" ]
        ports:
            - "${TEMPORAL_PORT:-7233}:7233"
            - "${TEMPORAL_UI_PORT:-8233}:8233"
        volumes:
            - temporaldata:/var/lib/temporal
        restart: unless-stopped

    # =========================================================================
    # MICROSERVICES
    # =========================================================================
    chat-service:
        <<: *common-env-file
        container_name: chat-service
        image: demo-backend-services:latest
        build:
            context: ../
            dockerfile: docker/services/Dockerfile
        command: ["python", "-m", "src.services.chat.app"]
        environment:
            <<: *backend-common-env
            AUTH_SERVICE_URL: http://auth-service:8000
            CHAT_SERVICE_PORT: 8000
            OTEL_SERVICE_NAME: chat-service
            NEMO_GUARDRAILS_ENABLED: ${NEMO_GUARDRAILS_ENABLED:-false}
            NEMO_GUARDRAILS_CONFIG: ${NEMO_GUARDRAILS_CONFIG:-/demo/server/config/guardrails}
        ports:
            - "${CHAT_SERVICE_PORT:-8001}:8000"
        extra_hosts:
            - "host.docker.internal:host-gateway"
        depends_on:
            postgres:
                condition: service_healthy
            auth-service:
                condition: service_started
            redis:
                condition: service_healthy
        restart: unless-stopped

    auth-service:
        <<: *common-env-file
        container_name: auth-service
        image: demo-backend-services:latest
        build:
            context: ../
            dockerfile: docker/services/Dockerfile
        command: ["python", "-m", "src.services.authentication.app"]
        environment:
            <<: *backend-common-env
            AUTH_SERVICE_PORT: 8000
            OTEL_SERVICE_NAME: auth-service
        ports:
            - "${AUTH_SERVICE_PORT:-8003}:8000"
        depends_on:
            postgres:
                condition: service_healthy
        restart: unless-stopped

    rag-service:
        <<: *common-env-file
        container_name: rag-service
        image: demo-backend-services:latest
        build:
            context: ../
            dockerfile: docker/services/Dockerfile
        command: ["python", "-m", "src.services.rag.app"]
        environment:
            <<: *backend-common-env
            RAG_SERVICE_PORT: 8000
            OTEL_SERVICE_NAME: rag-service
        ports:
            - "${RAG_SERVICE_PORT:-8002}:8000"
        volumes:
            - documentstaging:/tmp/demo-document-staging
        extra_hosts:
            - "host.docker.internal:host-gateway"
        depends_on:
            postgres:
                condition: service_healthy
            auth-service:
                condition: service_started
            redis:
                condition: service_healthy
            temporal:
                condition: service_started
            temporal-worker:
                condition: service_started
            neo4j:
                condition: service_healthy
            seaweedfs:
                condition: service_started
        restart: unless-stopped

    md-maker:
        <<: *common-env-file
        container_name: md-maker
        image: demo-backend-services:latest
        build:
            context: ../
            dockerfile: docker/services/Dockerfile
        command: ["python", "-m", "uvicorn", "src.services.md_maker.app:app", "--host", "0.0.0.0", "--port", "8000"]
        environment:
            <<: *backend-common-env
            OTEL_SERVICE_NAME: md-maker
        ports:
            - "${MD_MAKER_PORT:-8005}:8000"
        volumes:
            - documentstaging:/tmp/demo-document-staging
        extra_hosts:
            - "host.docker.internal:host-gateway"
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
        restart: unless-stopped

    md-ingestor:
        <<: *common-env-file
        container_name: md-ingestor
        image: demo-backend-services:latest
        build:
            context: ../
            dockerfile: docker/services/Dockerfile
        command: ["python", "-m", "uvicorn", "src.services.md_ingestor.app:app", "--host", "0.0.0.0", "--port", "8000"]
        environment:
            <<: *backend-common-env
            OTEL_SERVICE_NAME: md-ingestor
        ports:
            - "${MD_INGESTOR_PORT:-8006}:8000"
        volumes:
            - documentstaging:/tmp/demo-document-staging
        extra_hosts:
            - "host.docker.internal:host-gateway"
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
            neo4j:
                condition: service_healthy
            seaweedfs:
                condition: service_started
        restart: unless-stopped

    temporal-worker:
        <<: *common-env-file
        container_name: temporal-worker
        image: demo-backend-services:latest
        build:
            context: ../
            dockerfile: docker/services/Dockerfile
        command: ["python", "-m", "src.services.temporal.worker"]
        environment:
            <<: *backend-common-env
            TEMPORAL_ENABLED: "true"
            MD_MAKER_URL: http://md-maker:8000
            MD_INGESTOR_URL: http://md-ingestor:8000
            OTEL_SERVICE_NAME: temporal-worker
        depends_on:
            temporal:
                condition: service_started
            md-maker:
                condition: service_started
            md-ingestor:
                condition: service_started
        restart: unless-stopped

    # =========================================================================
    # LEGACY MONOLITH (kept for backward compatibility & extraction endpoints)
    # =========================================================================
    server:
        <<: *common-env-file
        container_name: server
        build:
            context: ../
            dockerfile: docker/server/Dockerfile
        command: >
            bash -c '
            export ENV_FLAG="docker";
            export CONTAINER_SERVER_NAME="server";
            python DB_initialization.py &&
            python app.py;
            '
        environment:
            <<: *backend-common-env
            OTEL_SERVICE_NAME: demo-server
            TEMPORAL_ENABLED: "true"
            MCP_SERVERS_JSON: ${MCP_SERVERS_JSON:-[]}
            NEMO_GUARDRAILS_ENABLED: ${NEMO_GUARDRAILS_ENABLED:-false}
            NEMO_GUARDRAILS_CONFIG: ${NEMO_GUARDRAILS_CONFIG:-/demo/server/config/guardrails}
        ports:
            - "${SERVER_PORT:-8080}:8080"
        volumes:
            - documentstaging:/tmp/demo-document-staging
        extra_hosts:
            - "host.docker.internal:host-gateway"
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
            temporal:
                condition: service_started
            temporal-worker:
                condition: service_started
            neo4j:
                condition: service_healthy
            seaweedfs:
                condition: service_started
        restart: unless-stopped

    # =========================================================================
    # FRONTEND
    # =========================================================================
    client:
        container_name: client
        build:
            context: ../
            dockerfile: docker/client/Dockerfile
        command: >
            sh -c '
            export ENV_FLAG="docker";
            export CONTAINER_SERVER_NAME="server";
            export CONTAINER_SERVER_PORT="8080";
            yarn dev --host 0.0.0.0
            '
        ports:
            - "${CLIENT_PORT:-5173}:5173"
        depends_on:
            - server
        restart: unless-stopped

    # =========================================================================
    # OBSERVABILITY (enabled with: docker compose --profile observability up)
    # =========================================================================
    otel-collector:
        image: otel/opentelemetry-collector-contrib:0.120.0
        profiles: ["observability"]
        command: ["--config=/etc/otelcol-contrib/config.yaml"]
        volumes:
            - ./observability/otel-collector.yml:/etc/otelcol-contrib/config.yaml:ro
        depends_on:
            - tempo
            - loki
        restart: unless-stopped

    prometheus:
        image: prom/prometheus:v3.2.1
        profiles: ["observability"]
        command:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
        volumes:
            - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
            - prometheusdata:/prometheus
        depends_on:
            - server
            - chat-service
            - rag-service
            - auth-service
            - md-maker
            - md-ingestor
            - otel-collector
        restart: unless-stopped

    tempo:
        image: grafana/tempo:2.7.2
        profiles: ["observability"]
        command: ["-config.file=/etc/tempo.yaml"]
        volumes:
            - ./observability/tempo.yml:/etc/tempo.yaml:ro
            - tempodata:/var/tempo
        restart: unless-stopped

    loki:
        image: grafana/loki:3.4.2
        profiles: ["observability"]
        command: ["-config.file=/etc/loki/local-config.yaml"]
        volumes:
            - ./observability/loki.yml:/etc/loki/local-config.yaml:ro
            - lokidata:/loki
        restart: unless-stopped

    grafana:
        <<: *common-env-file
        image: grafana/grafana:11.5.2
        profiles: ["observability"]
        environment:
            GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-demo}
            GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-demo}
            POSTGRES_DB: ${POSTGRES_DB:-demo}
            POSTGRES_USER: ${POSTGRES_USER:-demo}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-demo}
        ports:
            - "${GRAFANA_PORT:-3000}:3000"
        volumes:
            - grafanadata:/var/lib/grafana
            - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
            - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
        depends_on:
            postgres:
                condition: service_healthy
            prometheus:
                condition: service_started
            tempo:
                condition: service_started
            loki:
                condition: service_started
        restart: unless-stopped

volumes:
    postgres_data:
        driver: local
    neo4jdata:
        driver: local
    s3data:
        driver: local
    redisdata:
        driver: local
    temporaldata:
        driver: local
    documentstaging:
        driver: local
    prometheusdata:
        driver: local
    tempodata:
        driver: local
    lokidata:
        driver: local
    grafanadata:
        driver: local