global:
  scrape_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  # Legacy monolith
  - job_name: ask-server
    metrics_path: /metrics
    static_configs:
      - targets: ["server:8080"]

  # Standalone FastAPI chat service
  - job_name: chat-service
    metrics_path: /metrics
    static_configs:
      - targets: ["chat-service:8000"]

  # Standalone FastAPI RAG service
  - job_name: rag-service
    metrics_path: /metrics
    static_configs:
      - targets: ["rag-service:8000"]

  # Standalone authentication service
  - job_name: auth-service
    metrics_path: /metrics
    static_configs:
      - targets: ["auth-service:8000"]

  - job_name: md-maker
    metrics_path: /metrics
    static_configs:
      - targets: ["md-maker:8000"]

  - job_name: md-ingestor
    metrics_path: /metrics
    static_configs:
      - targets: ["md-ingestor:8000"]

  # OpenTelemetry Collector
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
